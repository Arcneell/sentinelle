name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# lecture seule par défaut : un step compromis n'obtient pas d'accès en écriture
# au dépôt (le jeton hérite sinon des permissions par défaut du dépôt).
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = plancher annoncé (README) ; 3.14 = image du serveur (Docker)
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Dépendances système (Qt en mode hors-écran)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-server.txt pytest httpx ruff

      - name: Lint (erreurs réelles uniquement)
        # ne bloque que sur les vraies erreurs (syntaxe, noms indéfinis, f-strings
        # cassées…) — pas sur le style, pour ne pas être bruyant.
        run: ruff check --select E9,F63,F7,F82 sentinelle sentinelle_server run.py

      - name: Compilation (syntaxe)
        run: python -m compileall sentinelle sentinelle_server run.py

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  # Paquet Debian : construit le .deb sur trixie (la cible des postes muraux)
  # et vérifie qu'il s'installe et démarre avec ses SEULS Depends — les
  # régressions de packaging n'étaient détectées que chez le client.
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construire le .deb (Debian 13)
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/src" -w /src debian:13 \
            bash packaging/build_deb.sh

      - name: Installer et fumer (Depends seuls, sans Recommends)
        run: |
          docker run --rm -v "$PWD/dist:/dist" debian:13 bash -ec '
            set -o pipefail
            apt-get update
            apt-get install -y --no-install-recommends /dist/*.deb
            # le plugin xcb doit être embarqué ET trouver ses bibliothèques système
            XCB=$(find /opt/sentinelle -name libqxcb.so | head -1)
            test -n "$XCB"
            ldd "$XCB" | (! grep "not found")
            # la pile vidéo ne doit JAMAIS être embarquée : une libmpv/libva du
            # bundle masque celles du système et casse VA-API (tuiles noires)
            test -z "$(find /opt/sentinelle -name "libmpv.so*" -o -name "libva.so*" -o -name "libavcodec.so*")"
            # --help traverse le bootloader PyInstaller + argparse sans écran
            /opt/sentinelle/sentinelle --help
            # démarrage réel de Qt : atteindre la boucle d événements (124 = timeout)
            timeout 15 env QT_QPA_PLATFORM=offscreen /opt/sentinelle/sentinelle || test $? -eq 124
          '

      # Le paquet était construit, vérifié, puis jeté avec le runner : il fallait
      # le reconstruire à la main pour chaque publication. Il est désormais
      # téléchargeable depuis le run — celui d'un tag sert directement d'asset
      # de release.
      - name: Publier le .deb comme artefact du run
        uses: actions/upload-artifact@v7
        with:
          name: sentinelle-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 90

  # Paquet Windows portable : un ZIP autonome, sans installation et sans binaire
  # à signer (l'interpréteur embarqué est celui de python.org, signé par la PSF).
  # Construit sur Windows et non sur Linux, pour que le test de fumée exerce le
  # paquet réel — chargement de libmpv-2.dll, greffon Qt « windows », chemin
  # ._pth — plutôt qu'une simple arborescence de fichiers.
  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Sert uniquement à faire tourner pip (les roues sont téléchargées
          # pour la version embarquée via --python-version, pas pour celle-ci).
          python-version: "3.13"

      - name: Construire le paquet portable
        env:
          # Évite la limite de 60 requêtes/heure de l'API GitHub anonyme lors de
          # la résolution du build libmpv.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh packaging/build_portable.ps1

      # Le script échoue déjà si son test de fumée échoue ; on vérifie ici ce
      # qu'il ne peut pas vérifier lui-même : qu'aucun exécutable étranger ne
      # part dans le ZIP. Tout .exe autre que ceux de python.org devrait être
      # signé, sinon les protections de poste bloqueront le paquet.
      - name: Aucun exécutable non signé dans le paquet
        shell: pwsh
        run: |
          $root = Get-ChildItem build/portable -Directory |
                  Where-Object Name -like "Sentinelle-*" | Select-Object -First 1
          $exes = Get-ChildItem -Recurse -File $root.FullName -Include *.exe
          $etrangers = $exes | Where-Object { $_.Directory.Name -ne "python" }
          if ($etrangers) {
              $etrangers | ForEach-Object { Write-Error "Exécutable inattendu : $($_.FullName)" }
              exit 1
          }
          foreach ($exe in $exes) {
              $sig = Get-AuthenticodeSignature $exe.FullName
              if ($sig.Status -ne "Valid") {
                  throw "Signature invalide sur $($exe.Name) : $($sig.Status)"
              }
              Write-Host "$($exe.Name) signé par $($sig.SignerCertificate.Subject)"
          }

      - name: Publier le portable comme artefact du run
        uses: actions/upload-artifact@v7
        with:
          name: sentinelle-windows-portable
          path: dist/*-windows-portable.zip
          if-no-files-found: error
          retention-days: 90

  # Agrégateur : c'est LE check requis par la protection de branche (contexte
  # « test », aussi attendu par l'auto-merge Dependabot). Il n'est vert que si
  # toute la matrice l'est ; `if: always()` l'empêche d'être « skipped » quand
  # la matrice échoue (un check requis sauté passerait pour réussi).
  test:
    needs: [tests, deb, portable-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Vérifie que la matrice est verte
        run: |
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.deb.result }}" = "success"
          test "${{ needs.portable-windows.result }}" = "success"
